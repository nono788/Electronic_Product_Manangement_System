<!DOCTYPE HTML>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastering Project</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crud">
        <div class="head">
            <h2>CRUDS</h2>
            <p>Create Read Update Delete Search</p>
        </div>
        <div class="inputs">
            <input type="text" id="title" placeholder="title">
            <div class="price">
                <input onkeyup="getTotal()" type="number" id="price" placeholder="price">
                <input onkeyup="getTotal()" type="number" id="taxes" placeholder="taxes">
                <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads">
                <input onkeyup="getTotal()" type="number" id="discount" placeholder="discount">
                <small id="total">88</small>
            </div>
            <input type="number" id="count" placeholder="count">
            <input type="text" id="category" placeholder="category">
            <button id="submit" class="btn" >create</button>
          
        </div>
        <div class="outputs">
            <div class="blocksearch">
                <input onkeyup = "searchData(this.value)" type="text" placeholder="search" id = "search">
                <div id="searchbtn">
                    <button onclick = "getSearchby(this.id)" id="searchBycategory">Search by category</button>
                    <button onclick = "getSearchby(this.id)" id="searchBytitle">Search by title</button>
                </div>
                    <div id="deleteAll">
                    </div>
            </div>
            <table border="1" class="table">
                <thead type="text">
                 <tr>
                    <th>ID</th>
                    <th>TITLE</th>
                    <th>PRICE</th>
                    <th>TAXES</th>
                    <th>ADS</th>
                    <th>DISCOUNT</th>
                    <th>TOTAL</th>
                    <th>CATEGORY</th>
                    <th><button id="button">UPDATE</button></th>
                    <th><button id="delete">DELETE</button></th>
                 </tr>
                </thead>
                <tbody id="tbody">
                </tbody>
            </table>

        </div>
    </div>


<script src="main.js">
</script>
</body>
</html>
